<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff4e1">
  <meta name="description" content="도형 스프린트, 배수 헌터, 픽셀탐정, 숫자홀을 한곳에서 즐겨요.">
  <title>라온오락실</title>
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:url" content="https://jednyj.github.io/raon-shape-game/games.html">
  <meta property="og:title" content="라온오락실">
  <meta property="og:description" content="도형 스프린트, 배수 헌터, 픽셀탐정, 숫자홀을 한곳에서 즐겨요.">
  <meta property="og:image" content="https://jednyj.github.io/raon-shape-game/raon-arcade-share-logo.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="라온수학 로고와 네 수학 게임의 캐릭터가 모인 라온오락실">
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: #20304e;
      background: #fff4e1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 0 25%, #ffe9bc 0, transparent 42%),
        radial-gradient(ellipse at 100% 90%, #f8dce6 0, transparent 45%),
        #fff4e1;
    }
    main {
      max-width: 1000px;
      margin: auto;
      padding: clamp(24px, 5vw, 56px) clamp(12px, 4vw, 32px) 44px;
    }
    header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(10px, 2.5vw, 20px);
      margin-bottom: clamp(22px, 4vw, 40px);
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 64px);
      line-height: 1.15;
      letter-spacing: -.07em;
      font-weight: 900;
      color: #252949;
    }
    .mark {
      width: clamp(38px, 8vw, 60px);
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px;
      transform: rotate(-9deg);
    }
    .mark i { border-radius: 28%; }
    .mark i:nth-child(1) { background: #53bea3; }
    .mark i:nth-child(2) { background: #ffbf42; }
    .mark i:nth-child(3) { background: #ed85a1; }
    .mark i:nth-child(4) { background: #9e89ec; }
    .games {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(11px, 2.6vw, 24px);
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .game {
      --tint: #e0f6ec;
      --accent: #216e5a;
      display: block;
      height: 100%;
      overflow: hidden;
      border: clamp(3px, .8vw, 7px) solid #fff;
      border-radius: clamp(15px, 3.8vw, 28px);
      background: var(--tint);
      color: inherit;
      box-shadow: 0 5px 0 #44333915, 0 12px 24px #47313012;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .hunter { --tint: #e4ecff; --accent: #304b91; }
    .pixel { --tint: #ffe9ee; --accent: #a33759; }
    .hole { --tint: #eee4ff; --accent: #64419b; }
    .game img {
      display: block;
      width: 100%;
      height: auto;
    }
    .caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      min-height: 49px;
      padding: clamp(8px, 2vw, 18px);
      font-size: clamp(13px, 3.6vw, 25px);
      line-height: 1.3;
      font-weight: 850;
      letter-spacing: -.045em;
      word-break: keep-all;
    }
    .arrow {
      display: grid;
      place-items: center;
      width: 1.45em;
      aspect-ratio: 1;
      flex: none;
      border-radius: 50%;
      background: #ffffffb8;
      color: var(--accent);
      font-size: .95em;
    }
    .game:focus-visible { outline: 3px solid #5743a3; outline-offset: 3px; }
    .game:active { transform: translateY(3px); }
    @media (hover: hover) {
      .game:hover { transform: translateY(-4px); box-shadow: 0 8px 0 #44333915, 0 15px 25px #47313022; }
    }
    @media (prefers-reduced-motion: reduce) {
      .game { transition: none; }
      .game:hover, .game:active { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <h1>라온오락실</h1>
    </header>
    <nav aria-label="게임 선택">
      <ul class="games">
        <li><a class="game" href="./">
          <img src="shape-sprint-share.jpg" width="1200" height="630" alt="">
          <span class="caption">도형 스프린트 <span class="arrow" aria-hidden="true">→</span></span>
        </a></li>
        <li><a class="game hunter" href="multiple-hunter.html">
          <img src="multiple-hunter-share.jpg" width="1200" height="630" alt="">
          <span class="caption">배수 헌터 <span class="arrow" aria-hidden="true">→</span></span>
        </a></li>
        <li><a class="game pixel" href="pixel-detective.html">
          <img src="pixel-detective-share.jpg" width="1200" height="630" alt="">
          <span class="caption">픽셀탐정 <span class="arrow" aria-hidden="true">→</span></span>
        </a></li>
        <li><a class="game hole" href="https://raonnumberhole.vercel.app/">
          <img src="https://raonnumberhole.vercel.app/number-hole-share.jpg" width="1200" height="630" alt="">
          <span class="caption">라온 숫자홀 <span class="arrow" aria-hidden="true">→</span></span>
        </a></li>
      </ul>
    </nav>
  </main>
</body>
</html>
